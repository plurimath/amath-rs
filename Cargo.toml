[package]
name = "plurimath-amath"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Shared-PARG asciimath raw parser for Rust"
license = "BSD-2-Clause"
readme = "README.md"
include = ["src/**", "include/**", "tests/**", "examples/**", "artifacts/**", "README.md", "LICENSE", "UPSTREAM.json", "Cargo.toml"]

[dependencies]
parsanol = "1.5.9"
serde_json = { version = "=1.0.140", features = ["arbitrary_precision", "preserve_order"] }

[features]
default = []
models = ["dep:serde", "dep:lutaml_rs", "dep:sha2"]
ffi = ["models"]
wasm = ["models", "dep:wasm-bindgen"]

[dependencies.serde]
version = "=1.0.219"
features = ["derive"]
optional = true

[dependencies.sha2]
version = "=0.11.0"
optional = true

[dependencies.lutaml_rs]
package = "lutaml-rs"
version = "=0.1.0"
git = "https://github.com/lutaml/lutaml-rs"
rev = "1f826b7dd0ba1545479df8a4ba715d67e2985b32"
default-features = false
features = ["runtime"]
optional = true

[lib]
name = "amath"
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Match the wasm-bindgen version already locked by Parsanol.
[dependencies.wasm-bindgen]
version = "=0.2.130"
optional = true

[[example]]
name = "wasm_reference"
required-features = ["models"]
