name: WASM

# Compile, package and execute the optional WASM transport.
# Node/browser packages are CI artifacts only; nothing is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Build the library for wasm32 (default features)
        run: cargo +stable build --locked --release --target wasm32-unknown-unknown --lib
      - name: Build the library for wasm32 (--lib --all-features)
        run: cargo +stable build --locked --release --target wasm32-unknown-unknown --lib --all-features
      - name: Install Node for the WASM runtime smoke
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned wasm-pack
        run: cargo +stable install wasm-pack --version 0.13.1 --locked
      - name: Build Node and browser packages
        run: |
          wasm-pack build --release --target nodejs --out-dir wasm-node --no-opt -- --locked --features wasm
          wasm-pack build --release --target web --out-dir wasm-web --no-opt -- --locked --features wasm
          cp LICENSE wasm-node/LICENSE
          cp LICENSE wasm-web/LICENSE
      - name: Write focused native byte references
        run: cargo +stable run --locked --release --features models --example wasm_reference > target/wasm-reference.json
      - name: Check frozen corpus samples and native byte parity in Node
        run: node tests/wasm/node.mjs
      - name: Upload Node and browser packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-wasm-node-web
          path: |
            wasm-node
            wasm-web
          if-no-files-found: error
